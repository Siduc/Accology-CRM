name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Smoke tests
        env:
          ENV: development
          AUTH_USERNAME: teststaff
          AUTH_PASSWORD: test-password-not-live
          SESSION_SECRET: test-session-secret-32-chars-ok
          DATABASE_URL: sqlite:///./pytest-ci.db
        run: pytest
